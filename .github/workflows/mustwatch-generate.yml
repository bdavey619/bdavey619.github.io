name: Must Watch — Generate

on:
  schedule:
    # Monday 10:00 UTC = 6:00 AM ET (EDT, UTC-4).
    # Adjust to "0 11 * * 1" in winter when EST (UTC-5) is active.
    - cron: "0 10 * * 1"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # Full history needed so we can branch cleanly from main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests anthropic

      - name: Generate Must Watch page
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python mustwatch/run.py --auto

      - name: Check for changes to index.html
        id: check_changes
        run: |
          if git diff --quiet mustwatch/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "mustwatch/index.html unchanged — nothing to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reset mustwatch-auto branch and commit
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -B creates or hard-resets the branch to the current HEAD (main)
          git checkout -B mustwatch-auto
          git add mustwatch/index.html
          git commit -m "chore: generate Must Watch — $(date -u '+%Y-%m-%d') [skip ci]"
          git push origin mustwatch-auto --force

      - name: Open or update PR
        if: steps.check_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WEEK=$(date -u '+%b %-d, %Y')

          # Write PR body to a file — avoids heredoc-in-subshell issues inside
          # YAML block scalars (YAML indentation prevents the heredoc terminator
          # from landing at column 0, which the shell requires).
          cat > /tmp/pr_body.md << 'PREOF'
          Auto-generated by GitHub Actions (`mustwatch/run.py --auto`).

          Review the ranking at `mustwatch/index.html` and merge to publish.

          ---
          - Default top 5 selected (no editorial override applied)
          - Merge to publish; close to discard this week's output
          PREOF

          # Check whether an open PR already exists for this branch
          EXISTING=$(gh pr list \
            --head mustwatch-auto \
            --base main \
            --state open \
            --json number \
            --jq 'length')

          if [ "$EXISTING" -eq 0 ]; then
            gh pr create \
              --head mustwatch-auto \
              --base main \
              --title "Must Watch This Week — ${WEEK}" \
              --body-file /tmp/pr_body.md
            echo "PR created."
          else
            echo "PR already open — branch updated, PR reflects new output."
          fi
