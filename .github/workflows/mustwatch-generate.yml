name: Must Watch — Generate

# ---------------------------------------------------------------------------
# Runs on a Monday schedule (8 AM ET) and on manual dispatch.
# Generates mustwatch/index.html non-interactively, commits it to the
# mustwatch-auto branch, then opens (or updates) a PR against main.
#
# You review the PR before merging. Merge = live publish. No blind pushes.
# ---------------------------------------------------------------------------

on:
  schedule:
    # Monday 8:00 AM ET = 12:00 UTC (UTC-4 during EDT, April–November)
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests anthropic

      - name: Generate Must Watch page
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python mustwatch/run.py --auto

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit to mustwatch-auto branch
        id: push
        run: |
          # Create/reset mustwatch-auto to current HEAD (main).
          # This ensures the branch always reflects the latest scripts
          # and the only diff in the PR is the generated HTML.
          git checkout -B mustwatch-auto

          git add mustwatch/index.html

          if git diff --cached --quiet; then
            echo "mustwatch/index.html unchanged — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            WEEK=$(date -u +"%Y-%m-%d")
            git commit -m "chore: auto-generate Must Watch — ${WEEK} [skip ci]"
            git push --force origin mustwatch-auto
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update review PR
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WEEK=$(date -u +"%B %-d, %Y")

          # If a PR is already open for this branch, just update its title.
          # The new commit on mustwatch-auto is already visible in the open PR.
          PR_STATE=$(gh pr view mustwatch-auto --json state -q .state 2>/dev/null || echo "NONE")

          if [ "$PR_STATE" = "OPEN" ]; then
            gh pr edit mustwatch-auto --title "Must Watch This Week — ${WEEK}"
            echo "Updated existing PR title to: Must Watch This Week — ${WEEK}"
          else
            gh pr create \
              --title "Must Watch This Week — ${WEEK}" \
              --body "Auto-generated Must Watch page for the week of **${WEEK}**.

**Review before merging:**
- Preview the page: go to the \`mustwatch-auto\` branch → \`mustwatch/index.html\` → \`Raw\` or open in browser
- If you want to adjust wording or swap an event, edit \`mustwatch/index.html\` directly on this branch
- Merge this PR to publish the page live on GitHub Pages

Generated by \`python mustwatch/run.py --auto\` (default top 5, no editorial override)." \
              --base main \
              --head mustwatch-auto
          fi
