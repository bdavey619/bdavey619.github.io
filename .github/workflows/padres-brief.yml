name: Padres Morning Brief

on:
  schedule:
    # 6:25 AM Eastern Time / 10:25 UTC (UTC-4 during EDT)
    # Shifted from 6:15 to give email a 6:25–6:30 AM ET landing window.
    - cron: "25 10 * * *"
  workflow_dispatch:

jobs:
  build-brief:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate brief.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python padres/build_brief.py

      - name: Build schedule
        run: python build_schedule.py --team padres

      - name: Archive brief
        run: python archive_brief.py --team padres

      - name: Render email HTML
        run: python render_email.py --team padres

      - name: Send email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python send_email.py --team padres

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add padres/brief.json padres/story_state.json padres/archive/ padres/schedule.json
          if git diff --cached --quiet; then
            echo "No changes to brief.json — skipping commit."
          else
            git commit -m "chore: update Padres morning brief [skip ci]"
            git restore .
            git pull --rebase origin main
            git push
          fi
