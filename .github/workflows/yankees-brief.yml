name: Yankees Morning Brief

on:
  schedule:
    # 7:00 AM Eastern Time / 11:00 UTC (UTC-4 during EDT)
    # Staggered 35 minutes after Padres to avoid resource contention.
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  build-brief:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate brief.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python yankees/build_brief.py

      - name: Build schedule
        run: python build_schedule.py --team yankees

      - name: Archive brief
        run: python archive_brief.py --team yankees

      - name: Render email HTML
        run: python render_email.py --team yankees

      - name: Send email
        env:
          RESEND_API_KEY: ${{ secrets.YANKEES_RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.YANKEES_EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.YANKEES_EMAIL_FROM }}
        run: python send_email.py --team yankees

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add yankees/brief.json yankees/story_state.json yankees/archive/ yankees/schedule.json
          if git diff --cached --quiet; then
            echo "No changes to brief.json — skipping commit."
          else
            git commit -m "chore: update Yankees morning brief [skip ci]"
            git restore .
            git pull --rebase origin main
            git push || (git pull --rebase origin main && git push)
          fi
