<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Athletics Morning Brief — Schedule</title>
  <meta name="theme-color" content="#fbfcfc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d2a31" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script>
    /* Before first paint: apply a stored theme choice so it never flashes.
       With no choice, CSS follows the OS. */
    /* Phones default to dark; a tap on the toggle still overrides it. */
    try {
      var c = localStorage.getItem('theme-choice');
      if (c !== 'light' && c !== 'dark' && window.matchMedia('(max-width: 640px)').matches) c = 'dark';
      if (c === 'light' || c === 'dark') document.documentElement.setAttribute('data-theme', c);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .back-link {
      font-family: var(--sans);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--ink-soft);
      text-decoration: none;
      letter-spacing: 0.03em;
    }
    .back-link:hover { color: var(--ink); }

    /* 4-column summary override */
    #schedule-summary { grid-template-columns: repeat(4, 1fr); }
    @media (max-width: 480px) {
      #schedule-summary { grid-template-columns: repeat(2, 1fr); }
    }

    /* ── Calendar grid ─────────────────────────────── */
    .cal-header-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 1px;
    }
    .cal-header-cell {
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-faint);
      padding: 6px 2px;
    }
    .cal-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: var(--rule-soft);
      margin-bottom: 1px;
    }
    .cal-cell {
      background: var(--bg);
      min-height: 90px;
      padding: 5px 4px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .cal-empty { background: var(--surface); }
    /* Series result — applied to the cell, behind game cards; today overrides */
    [data-series-result="won"]   { background: rgba(34, 139, 34, 0.06); }
    [data-series-result="lost"]  { background: rgba(180, 40, 40, 0.06); }
    [data-series-result="split"] { background: rgba(120, 120, 120, 0.03); }
    /* Today: team-specific warm tint + accented day number (overrides series) */
    .cal-today { background: var(--highlight); }

    .cal-day-num {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-faint);
      font-weight: 500;
      line-height: 1;
      margin-bottom: 2px;
    }
    .cal-today .cal-day-num { color: var(--accent); font-weight: 700; }


    /* ── Game card ────────────────────────────────── */
    .cal-game {
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-radius: 2px;
      padding: 3px 4px 3px 6px;
      font-size: 11px;
      line-height: 1.3;
      background: var(--hover);
      border-left: 3px solid transparent;
    }
    .cal-linked { cursor: pointer; }
    .cal-linked:hover { background: rgba(127,127,127,0.14); }

    /* Win/Loss left-border only — background comes from series-level cell tint */
    .cal-win  { border-left-color: #4a7c59; }
    .cal-loss { border-left-color: #b03030; }

    /* Upcoming: transparent, dashed border signals "pending" */
    .cal-game-upcoming {
      background: transparent;
      border-left-color: var(--rule-soft);
      border-left-style: dashed;
    }

    /* ── Opponent line ────────────────────────────── */
    .cal-opp {
      display: flex;
      align-items: baseline;
      gap: 3px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    /* Home/away prefix — muted, smaller, visually distinct from team abbr */
    .cal-ha {
      color: var(--ink-faint);
      font-weight: 500;
      font-size: 9px;
      letter-spacing: 0.08em;
    }
    .cal-away .cal-ha { font-style: italic; }
    .cal-opp-name { color: var(--ink); }

    /* ── Result line ─────────────────────────────── */
    .cal-result {
      display: flex;
      align-items: center;
      gap: 3px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
    }
    .cal-badge {
      display: inline-block;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 1px 3px;
      border-radius: 2px;
      line-height: 1.4;
    }
    .cal-win  .cal-badge { color: #4a7c59; background: rgba(74,124,89,0.15); }
    .cal-loss .cal-badge { color: #b03030; background: rgba(176,48,48,0.12); }
    .cal-score { color: var(--ink-soft); }

    /* ── Time / probables ────────────────────────── */
    .cal-time {
      font-size: 10px;
      color: var(--ink-soft);
      font-family: var(--mono);
    }
    .cal-live { color: var(--accent); font-weight: 700; }

    .cal-probable {
      font-size: 9px;
      color: var(--ink-faint);
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cal-opening-day {
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 1px;
    }

    /* ── Month navigation ───────────────────────── */
    .cal-month-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--rule-soft);
    }
    .cal-month-nav .section-title {
      flex: 1;
      text-align: center;
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }
    .cal-nav-btn {
      background: none;
      border: 1px solid var(--rule-soft);
      border-radius: 4px;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      padding: 5px 10px;
      color: var(--ink-soft);
      font-family: var(--sans);
      flex-shrink: 0;
    }
    .cal-nav-btn:hover:not(:disabled) { background: var(--hover); }
    .cal-nav-btn:disabled { opacity: 0.3; cursor: default; }

    @media (max-width: 600px) {
      .cal-cell { min-height: 64px; padding: 4px 3px; }
      .cal-game { padding: 2px 3px 2px 5px; }
      .cal-opp { font-size: 10px; }
      .cal-result { font-size: 10px; }
      .cal-probable { display: none; }
      .cal-time { font-size: 9px; }
      .cal-header-cell { font-size: 9px; padding: 4px 1px; }
    }
  </style>
</head>
<body>
  <main id="brief">
    <header class="site-header">
      <div>
        <a href="/" class="site-name">Brett Davey</a>
        <div class="site-status">Building in San Diego 🌊☀️</div>
      </div>
      <button class="theme-toggle" aria-label="Toggle dark mode">☽</button>
    </header>

    <header class="masthead">
      <div class="masthead-meta">
        <span id="brief-date">Schedule</span>
        <a href="index.html" class="back-link">← Current Brief</a>
      </div>
      <h1 class="masthead-title">Athletics Morning Brief</h1>
      <div class="masthead-rule"></div>
    </header>

    <section id="schedule-summary" class="summary-bar" hidden>
      <div><span class="label">Month</span><span class="value" id="sc-month-record">—</span></div>
      <div><span class="label">Streak</span><span class="value" id="sc-streak">—</span></div>
      <div><span class="label">Last 10</span><span class="value" id="sc-last10">—</span></div>
      <div><span class="label">Up Next</span><span class="value" id="sc-next">—</span></div>
    </section>

    <section id="schedule-cal" class="card" hidden>
      <div class="cal-month-nav">
        <button class="cal-nav-btn" id="cal-prev-month" aria-label="Previous month">&#8592;</button>
        <h2 class="section-title" id="cal-month-title">—</h2>
        <button class="cal-nav-btn" id="cal-next-month" aria-label="Next month">&#8594;</button>
      </div>
      <div id="calendar-grid"></div>
    </section>

    <div id="cal-error" class="error" hidden>
      Schedule not yet available for this team.
    </div>
