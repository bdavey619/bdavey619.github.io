<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback</title>
  <script>
    /* Before first paint: apply a stored theme choice so it never flashes.
       With no choice, CSS follows the OS. */
    /* Phones default to dark; a tap on the toggle still overrides it. */
    try {
      var c = localStorage.getItem('theme-choice');
      if (c !== 'light' && c !== 'dark' && window.matchMedia('(max-width: 640px)').matches) c = 'dark';
      if (c === 'light' || c === 'dark') document.documentElement.setAttribute('data-theme', c);
    } catch (e) {}
  </script>
  <style>
    :root { --bg: #fbfcfc; --strong: #16232c; --text: #2b3439; --muted: #6b7a82; --link: #0b6e7a; --rule: #e6ebee; }
    [data-theme="dark"] { --bg: #0d2a31; --strong: #eef4f5; --text: #cfdcdf; --muted: #8ea8ad; --link: #6fc7d1; --rule: #1d4753; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d2a31; --strong: #eef4f5; --text: #cfdcdf; --muted: #8ea8ad; --link: #6fc7d1; --rule: #1d4753; } }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Open Sans", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--strong);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 16px;
    }
    .message {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 8px;
    }
    .sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .back-link {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
      text-decoration: none;
      color: var(--text);
      border-bottom: 1px solid var(--rule);
      padding-bottom: 1px;
    }
    .back-link:hover { color: var(--strong); border-color: var(--strong); }
  </style>
</head>
<body>
  <div class="card">
    <p class="label" id="team-label">Morning Brief</p>
    <p class="message">Got it. Thanks.</p>
    <p class="sub" id="vote-sub"></p>
    <a class="back-link" id="back-link" href="/">Back to brief &rarr;</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const team = params.get('team') || '';
    const vote = params.get('vote') || '';
    const date = params.get('date') || '';

    const teamNames = {
      yankees:   'Yankees Morning Brief',
      giants:    'Giants Morning Brief',
      padres:    'Padres Morning Brief',
      athletics: 'Athletics Morning Brief',
    };
    const teamUrls = {
      yankees:   'https://bdavey619.github.io/yankees/',
      giants:    'https://bdavey619.github.io/giants/',
      padres:    'https://bdavey619.github.io/padres/',
      athletics: 'https://bdavey619.github.io/athletics/',
    };

    if (team && teamNames[team]) {
      document.getElementById('team-label').textContent = teamNames[team];
    }

    const voteLabels = { hit: 'Hit logged.', miss: 'Miss logged.' };
    if (vote && voteLabels[vote]) {
      document.getElementById('vote-sub').textContent = voteLabels[vote];
    }

    const backLink = document.getElementById('back-link');
    if (team && teamUrls[team]) {
      backLink.href = teamUrls[team];
      backLink.textContent = '← Back to brief';
    } else {
      backLink.href = 'https://bdavey619.github.io/';
      backLink.textContent = '← Back to home';
    }
  </script>
</body>
</html>
