<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Morning Edition — San Diego</title>
    <meta name="description" content="A finite daily local news front page for San Diego." />
    <!--
      TODO: Once Morning Edition is deployed to Vercel, replace this placeholder page
      with a redirect to the live URL (e.g. https://morning-edition.vercel.app):

        <meta http-equiv="refresh" content="0; url=TODO_MORNING_EDITION_DEPLOYED_URL" />

      Upgrade path: if this site moves to Vercel, use a vercel.json rewrite instead so
      the URL stays bdavey.co/morning-edition without redirecting:

        {
          "rewrites": [
            {
              "source": "/morning-edition/:path*",
              "destination": "https://morning-edition.vercel.app/:path*"
            }
          ]
        }
    -->
    <script>
      /* Before first paint: apply a stored theme choice so it never flashes.
         With no choice, CSS follows the OS. */
      /* Phones default to dark; a tap on the toggle still overrides it. */
      try {
        var c = localStorage.getItem('theme-choice');
        if (c !== 'light' && c !== 'dark' && window.matchMedia('(max-width: 640px)').matches) c = 'dark';
        if (c === 'light' || c === 'dark') document.documentElement.setAttribute('data-theme', c);
      } catch (e) {}
    </script>
    <style>
      :root { --bg: #fbfcfc; --strong: #16232c; --text: #2b3439; --muted: #6b7a82; --link: #0b6e7a; --rule: #e6ebee; }
      [data-theme="dark"] { --bg: #0d2a31; --strong: #eef4f5; --text: #cfdcdf; --muted: #8ea8ad; --link: #6fc7d1; --rule: #1d4753; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d2a31; --strong: #eef4f5; --text: #cfdcdf; --muted: #8ea8ad; --link: #6fc7d1; --rule: #1d4753; } }
      body {
        font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Open Sans", Helvetica, Arial, sans-serif;
        background: var(--bg); color: var(--text);
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; margin: 0; text-align: center; padding: 2rem; box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
      }
      h1 { margin: 0 0 0.25rem; font-size: 24px; color: var(--strong); }
      .tagline { color: var(--muted); margin: 0 0 1.5rem; }
      p { color: var(--muted); font-size: 15px; margin: 0 0 0.75rem; }
      a { color: var(--link); text-decoration: none; }
      a:hover { text-decoration: underline; text-underline-offset: 3px; }
    </style>
  </head>
  <body>
    <div>
      <h1>Morning Edition</h1>
      <p class="tagline">Not a feed. A front page.</p>
      <p>Morning Edition is being prepared for deployment.</p>
      <p>Soon this page will open the live San Diego daily edition.</p>
      <p><a href="https://github.com/bdavey619/morning-edition">github.com/bdavey619/morning-edition</a></p>
    </div>
  </body>
</html>
