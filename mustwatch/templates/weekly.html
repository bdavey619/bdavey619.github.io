<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Must Watch This Week</title>
  <meta name="theme-color" content="#fbfcfc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d2a31" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    /* Before first paint: apply a stored theme choice so it never flashes.
       With no choice, CSS follows the OS. */
    /* Phones default to dark; a tap on the toggle still overrides it. */
    try {
      var c = localStorage.getItem('theme-choice');
      if (c !== 'light' && c !== 'dark' && window.matchMedia('(max-width: 640px)').matches) c = 'dark';
      if (c === 'light' || c === 'dark') document.documentElement.setAttribute('data-theme', c);
    } catch (e) {}
  </script>
  <style>
    :root {
      --bg: #fbfcfc; --surface: #f1f4f6; --strong: #16232c; --text: #2b3439; --muted: #6b7a82;
      --rule: #e1e7ea; --rule-strong: #c9d3d8; --link: #0b6e7a;
    }
    [data-theme="dark"] {
      --bg: #0d2a31; --surface: #12363f; --strong: #eef4f5; --text: #cfdcdf; --muted: #8ea8ad;
      --rule: #1d4753; --rule-strong: #2a5a66; --link: #6fc7d1;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0d2a31; --surface: #12363f; --strong: #eef4f5; --text: #cfdcdf; --muted: #8ea8ad;
        --rule: #1d4753; --rule-strong: #2a5a66; --link: #6fc7d1;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--strong);
      line-height: 1.5;
    }

    .page {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 20px 24px;
    }

    /* ---- Header ---- */

    .header {
      border-bottom: 0;
      padding-bottom: 14px;
      margin-bottom: 28px;
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .header-week {
      font-size: 12px;
      color: var(--muted);
      margin-top: 5px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ---- Event card ---- */

    .event {
      border-top: 1px solid var(--rule);
      padding: 24px 0 20px;
    }

    .event:last-of-type {
      border-bottom: 1px solid var(--rule);
    }

    .event-top {
      display: flex;
      align-items: flex-start;
      gap: 18px;
    }

    .rank {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--strong);
      min-width: 44px;
      padding-top: 2px;
    }

    .event-identity {
      flex: 1;
    }

    .matchup {
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }

    .event-detail {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .sport-tag {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid var(--rule-strong);
      color: var(--muted);
      padding: 2px 5px;
      border-radius: 2px;
      white-space: nowrap;
    }

    .detail-sep {
      color: var(--rule-strong);
    }

    .score-badge {
      font-size: 14px;
      font-weight: 700;
      color: var(--strong);
      white-space: nowrap;
      padding-top: 3px;
      font-variant-numeric: tabular-nums;
    }

    /* ---- Flags ---- */

    .flags {
      margin-top: 10px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .flag {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--rule-strong);
      padding: 2px 6px;
      border-radius: 2px;
    }

    /* ---- Explanation ---- */

    .explanation {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
      margin-top: 16px;
    }

    /* ---- Score breakdown ---- */

    .breakdown {
      display: flex;
      margin-top: 14px;
      border: 1px solid var(--rule);
      border-radius: 4px;
      overflow: hidden;
      background: var(--surface);
    }

    .breakdown-item {
      flex: 1;
      text-align: center;
      padding: 9px 4px;
      border-right: 1px solid var(--rule);
    }

    .breakdown-item:last-child {
      border-right: none;
    }

    .breakdown-label {
      display: block;
      font-size: 9px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .breakdown-value {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
    }

    .breakdown-max {
      display: block;
      font-size: 9px;
      color: var(--rule-strong);
      font-family: 'Courier New', Courier, monospace;
    }

    /* ---- Footer ---- */

    .footer {
      margin-top: 44px;
      padding-top: 14px;
      border-top: 1px solid var(--rule);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.03em;
    }

    /* ---- Diagnostics ---- */

    .diag-section {
      margin-top: 44px;
      border-top: 1px dashed var(--rule);
      padding-top: 14px;
    }

    .diag-summary {
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--rule-strong);
      cursor: pointer;
      user-select: none;
      list-style: none;
    }

    .diag-summary::-webkit-details-marker { display: none; }
    .diag-summary::before { content: "▶  "; font-size: 9px; }
    details[open] .diag-summary::before { content: "▼  "; }
    .diag-summary:hover { color: var(--muted); }

    .diag-body { margin-top: 14px; }

    .diag-filters {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .diag-filter-btn {
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 1px solid var(--rule-strong);
      background: none;
      color: var(--muted);
      padding: 3px 10px;
      border-radius: 2px;
      cursor: pointer;
    }

    .diag-filter-btn.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .diag-tbl-wrap { overflow-x: auto; }

    .diag-tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      font-family: 'Courier New', Courier, monospace;
    }

    .diag-tbl th {
      text-align: left;
      font-size: 9px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--rule-strong);
      padding: 4px 10px 4px 0;
      border-bottom: 1px solid var(--rule);
      white-space: nowrap;
    }

    .diag-tbl td {
      padding: 5px 10px 5px 0;
      border-bottom: 1px solid var(--surface);
      vertical-align: middle;
    }

    .diag-above td { color: var(--text); }
    .diag-below td { color: var(--muted); }

    .diag-rk { font-weight: 600; white-space: nowrap; min-width: 28px; }

    .diag-sport {
      font-size: 9px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--rule-strong);
      white-space: nowrap;
    }

    .diag-matchup {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      font-size: 11px;
      white-space: nowrap;
    }

    .dn {
      text-align: right;
      white-space: nowrap;
      padding-right: 14px !important;
    }

    .diag-near {
      font-size: 9px;
      color: #c07050;
      margin-left: 4px;
    }

    .diag-flag {
      font-size: 9px;
      letter-spacing: 0.03em;
      border: 1px solid var(--rule);
      color: var(--muted);
      padding: 1px 4px;
      border-radius: 2px;
      margin-right: 3px;
      white-space: nowrap;
      display: inline-block;
    }

    .diag-pitchers {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
    }

    .diag-cut-row td {
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--rule-strong);
      text-align: center;
      padding: 6px 0;
    }

    .diag-lbl {
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--rule-strong);
      margin-bottom: 8px;
      margin-top: 20px;
    }

    .diag-leaders { margin-top: 4px; }

    .diag-leader {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-size: 11px;
      padding: 5px 0;
      border-bottom: 1px solid var(--surface);
    }

    .diag-leader-spt {
      font-family: 'Courier New', Courier, monospace;
      font-size: 9px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--rule-strong);
      min-width: 28px;
    }

    .diag-leader-game {
      flex: 1;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      color: var(--text);
    }

    .diag-leader-score {
      font-family: 'Courier New', Courier, monospace;
      color: var(--text);
    }

    .diag-in  { font-size: 10px; color: #6a9a6a; }
    .diag-out { font-size: 10px; color: var(--rule-strong); }

    .diag-mlb { margin-top: 4px; }

    .diag-mlb-row {
      display: flex;
      gap: 10px;
      font-size: 11px;
      font-family: 'Courier New', Courier, monospace;
      padding: 4px 0;
      border-bottom: 1px solid var(--surface);
      color: var(--muted);
    }

    .diag-mlb-lbl {
      font-size: 9px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--rule-strong);
      min-width: 130px;
      flex-shrink: 0;
    }

    .diag-mlb-note {
      font-size: 11px;
      color: var(--rule-strong);
      font-family: 'Courier New', Courier, monospace;
      padding: 4px 0;
    }

    /* ---- AI Editor's Note ---- */

    .review-section {
      margin-top: 20px;
      border-top: 1px dashed var(--rule);
      padding-top: 14px;
    }

    .review-summary {
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--rule-strong);
      cursor: pointer;
      user-select: none;
      list-style: none;
    }

    .review-summary::-webkit-details-marker { display: none; }
    .review-summary::before { content: "▶  "; font-size: 9px; }
    details[open] .review-summary::before { content: "▼  "; }
    .review-summary:hover { color: var(--muted); }

    .review-body {
      margin-top: 14px;
      font-size: 11px;
      font-family: 'Courier New', Courier, monospace;
      color: var(--muted);
    }

    .review-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 10px;
    }

    .review-conf {
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 2px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .review-conf-high   { background: #e8f0e8; color: #4a7a4a; border: 1px solid #b8d8b8; }
    .review-conf-med    { background: #f5f0e0; color: #7a6a30; border: 1px solid #d8c870; }
    .review-conf-low    { background: #f5eded; color: #8a4a4a; border: 1px solid #d8b8b8; }

    .review-summary-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      font-size: 12px;
      color: var(--text);
      line-height: 1.5;
    }

    .review-lbl {
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--rule-strong);
      margin: 12px 0 4px;
    }

    .review-note {
      font-size: 11px;
      color: var(--muted);
      padding: 4px 0;
      border-bottom: 1px solid var(--surface);
      line-height: 1.5;
    }

    .review-note-ok   { color: #5a8a5a; }
    .review-note-warn { color: #8a5a30; }
  
    /* ---- Site header / footer (matches bdavey.co) ---- */
    .site-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 10px; border-bottom: 1px solid var(--rule); margin-bottom: 24px; }
    .site-name { display: block; font-weight: 700; font-size: 18px; line-height: 1.3; color: var(--strong); text-decoration: none; }
    .site-status { font-size: 14px; color: var(--muted); }
    .theme-toggle { background: none; border: 0; padding: 6px; cursor: pointer; font-size: 20px; line-height: 1; color: var(--strong); }
    .site-footer { display: flex; justify-content: center; gap: 28px; padding: 24px 0 8px; }
    .site-footer a { color: var(--muted); display: flex; }
    .site-footer a:hover { color: var(--link); }
    .site-footer svg { width: 20px; height: 20px; fill: currentColor; }
  </style>
</head>
<body>
  <div class="page">

    <header class="site-header">
      <div>
        <a href="/" class="site-name">Brett Davey</a>
        <div class="site-status">Building in San Diego 🌊☀️</div>
      </div>
      <button class="theme-toggle" aria-label="Toggle dark mode">☽</button>
    </header>

    <header class="header">
      <div class="header-title">Must Watch This Week</div>
      <div class="header-week">{{week_label}}</div>
    </header>

    <main>
      {{events_html}}
    </main>

    <footer class="footer">
      Generated {{generated_at}}&nbsp;&nbsp;·&nbsp;&nbsp;Scores reflect narrative setup going into each game, not predicted game quality.
    </footer>

    {{diagnostics_html}}

    {{review_html}}

  </div>
  <script src="/js/main.js"></script>
</body>
</html>
