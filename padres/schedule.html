<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Padres Morning Brief — Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .back-link {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      color: #5a534c;
      text-decoration: none;
      letter-spacing: 0.03em;
    }
    .back-link:hover { color: #1a1613; }

    #schedule-summary {
      grid-template-columns: repeat(4, 1fr);
    }
    @media (max-width: 480px) {
      #schedule-summary { grid-template-columns: repeat(2, 1fr); }
    }

    .cal-header-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 1px;
    }
    .cal-header-cell {
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #8a8278;
      padding: 6px 2px;
    }
    .cal-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: #d8d2c4;
      margin-bottom: 1px;
    }
    .cal-cell {
      background: #faf8f3;
      min-height: 86px;
      padding: 6px 5px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .cal-empty { background: #f4f0e8; }
    .cal-today { background: #fff8e8; }

    .cal-day-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #8a8278;
      font-weight: 500;
      line-height: 1;
      margin-bottom: 1px;
    }
    .cal-today .cal-day-num { color: #2f241d; font-weight: 700; }

    .cal-game {
      display: flex;
      flex-direction: column;
      gap: 1px;
      border-radius: 2px;
      padding: 3px 4px;
      background: rgba(0,0,0,0.03);
      font-size: 11px;
      line-height: 1.3;
    }
    .cal-linked { cursor: pointer; }
    .cal-linked:hover { background: rgba(0,0,0,0.07); }

    .cal-opp {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      color: #1a1613;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .cal-result {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
    }
    .cal-win .cal-result  { color: #2f241d; }
    .cal-loss .cal-result { color: #b03030; }

    .cal-time {
      font-size: 10px;
      color: #5a534c;
      font-family: 'JetBrains Mono', monospace;
    }
    .cal-live { color: #2f241d; font-weight: 700; }

    .cal-probable {
      font-size: 9px;
      color: #8a8278;
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 600px) {
      .cal-cell { min-height: 64px; padding: 4px 3px; }
      .cal-game { padding: 2px 3px; }
      .cal-opp { font-size: 10px; }
      .cal-result { font-size: 10px; }
      .cal-probable { display: none; }
      .cal-time { font-size: 9px; }
      .cal-header-cell { font-size: 9px; padding: 4px 1px; }
    }
  </style>
</head>
<body>
  <main id="brief">
    <header class="masthead">
      <div class="masthead-meta">
        <span id="brief-date">Schedule</span>
        <a href="index.html" class="back-link">← Current Brief</a>
      </div>
      <h1 class="masthead-title">Padres Morning Brief</h1>
      <div class="masthead-rule"></div>
    </header>

    <section id="schedule-summary" class="summary-bar" hidden>
      <div><span class="label">Month</span><span class="value" id="sc-month-record">—</span></div>
      <div><span class="label">Streak</span><span class="value" id="sc-streak">—</span></div>
      <div><span class="label">Last 10</span><span class="value" id="sc-last10">—</span></div>
      <div><span class="label">Up Next</span><span class="value" id="sc-next">—</span></div>
    </section>

    <section id="schedule-cal" class="card" hidden>
      <h2 class="section-title" id="cal-month-title">—</h2>
      <div id="calendar-grid"></div>
    </section>

    <div id="cal-error" class="error" hidden>
      Schedule not yet available for this team.
    </div>
  </main>

  <script>
    window.SCHEDULE_CONFIG = {
      team:      'padres',
      teamName:  'Padres',
      teamAbbr:  'SD',
      division:  'NL West',
      homeVenue: 'Petco Park',
      teamClass: 'padres',
    };
  </script>
  <script src="../js/schedule.js"></script>
</body>
</html>
