    <div id="lightbox" class="lightbox" hidden>
      <button class="lightbox-close" aria-label="Close">&times;</button>
      <button class="lightbox-prev" aria-label="Previous">&#8592;</button>
      <img src="" alt="">
      <button class="lightbox-next" aria-label="Next">&#8594;</button>
    </div>

    <main>
      <div class="photo-grid">
        <img src="images/DSC03434.JPG" alt="">
        <img src="images/DSC03536.JPG" alt="">
        <img src="images/DSC03583.JPG" alt="">

  <script src="../js/main.js"></script>
  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = lightbox.querySelector('img');
    const imgs = Array.from(document.querySelectorAll('.photo-grid img'));
    let current = 0;

    function open(index) {
      current = index;
      lightboxImg.src = imgs[current].src;
      lightbox.removeAttribute('hidden');
    }

    function close() {
      lightbox.setAttribute('hidden', '');
      lightboxImg.src = '';
    }

    function prev() {
      open((current - 1 + imgs.length) % imgs.length);
    }

    function next() {
      open((current + 1) % imgs.length);
    }

    imgs.forEach(function(img, i) {
      img.addEventListener('click', function() { open(i); });
    });

    lightbox.querySelector('.lightbox-close').addEventListener('click', close);
    lightbox.querySelector('.lightbox-prev').addEventListener('click', function(e) { e.stopPropagation(); prev(); });
    lightbox.querySelector('.lightbox-next').addEventListener('click', function(e) { e.stopPropagation(); next(); });

    lightbox.addEventListener('click', function(e) {
      if (e.target === lightbox || e.target === lightboxImg) close();
    });

    document.addEventListener('keydown', function(e) {
      if (lightbox.hasAttribute('hidden')) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowLeft') prev();
      if (e.key === 'ArrowRight') next();
    });
  </script>
</body>
