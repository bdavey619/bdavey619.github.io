<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photos — Brett Davey</title>
  <meta name="description" content="A few of my favorite photos.">
  <meta property="og:title" content="Photos — Brett Davey">
  <meta property="og:description" content="A few of my favorite photos.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bdavey.co/photos/">
  <meta property="og:image" content="https://bdavey.co/assets/og-image.png">
  <meta property="og:image:width" content="2400">
  <meta property="og:image:height" content="1260">
  <meta property="og:image:alt" content="Brett Davey — I build small things that change what you notice.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#dbe3e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d2a31" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="https://bdavey.co/photos/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container container--wide">
    <header>
      <nav>
        <div class="site-title">
          <a href="/" class="site-name">Brett Davey</a>
          <div class="site-status">Building in San Diego 🌊☀️</div>
        </div>
        <div class="nav-actions">
          <button class="theme-toggle" aria-label="Toggle dark mode">☽</button>
        </div>
      </nav>
    </header>

    <div id="lightbox" class="lightbox" hidden>
      <button class="lightbox-close" aria-label="Close">&times;</button>
      <button class="lightbox-prev" aria-label="Previous">&#8592;</button>
      <img src="" alt="">
      <button class="lightbox-next" aria-label="Next">&#8594;</button>
    </div>

    <main>
      <h1>Photos</h1>
      <p class="muted photos-intro">Places that reset me.</p>
      <div class="photo-grid">
        <img loading="lazy" decoding="async" src="images/DSC03434.JPG" alt="">
        <img loading="lazy" decoding="async" src="images/DSC03536.JPG" alt="">
        <img loading="lazy" decoding="async" src="images/DSC03583.JPG" alt="">
        <img loading="lazy" decoding="async" src="images/DSC03589.JPG" alt="">
        <img loading="lazy" decoding="async" src="images/DSC03650.JPG" alt="">
        <img loading="lazy" decoding="async" src="images/DSC03659.JPG" alt="">
        <img loading="lazy" decoding="async" src="images/DSC03680.JPG" alt="">
        <img loading="lazy" decoding="async" src="images/DSC03683.JPG" alt="">
        <img loading="lazy" decoding="async" src="images/DSC03734.JPG" alt="">
        <img loading="lazy" decoding="async" src="images/DSC03857.JPG" alt="">
        <img loading="lazy" decoding="async" src="images/DSC03859.JPG" alt="">
        <img loading="lazy" decoding="async" src="images/IMG_2062.jpeg" alt="">
      </div>
    </main>

    <footer>
      <div class="footer-row">
        <p>&copy; 2026 Brett Davey</p>
        <p class="footer-links"><a href="/">Home</a></p>
      </div>
    </footer>
  </div>
  <script src="../js/main.js"></script>
  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = lightbox.querySelector('img');
    const imgs = Array.from(document.querySelectorAll('.photo-grid img'));
    let current = 0;

    function open(index) {
      current = index;
      lightboxImg.src = imgs[current].src;
      lightbox.removeAttribute('hidden');
    }

    function close() {
      lightbox.setAttribute('hidden', '');
      lightboxImg.src = '';
    }

    function prev() {
      open((current - 1 + imgs.length) % imgs.length);
    }

    function next() {
      open((current + 1) % imgs.length);
    }

    imgs.forEach(function(img, i) {
      img.addEventListener('click', function() { open(i); });
    });

    lightbox.querySelector('.lightbox-close').addEventListener('click', close);
    lightbox.querySelector('.lightbox-prev').addEventListener('click', function(e) { e.stopPropagation(); prev(); });
    lightbox.querySelector('.lightbox-next').addEventListener('click', function(e) { e.stopPropagation(); next(); });

    lightbox.addEventListener('click', function(e) {
      if (e.target === lightbox || e.target === lightboxImg) close();
    });

    document.addEventListener('keydown', function(e) {
      if (lightbox.hasAttribute('hidden')) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowLeft') prev();
      if (e.key === 'ArrowRight') next();
    });
  </script>
</body>
</html>
