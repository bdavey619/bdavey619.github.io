  <script>
    /* Runs before first paint so a stored choice never flashes the wrong theme.
       With no stored choice we leave the page unstamped and let the CSS
       prefers-color-scheme block decide, which also means the page follows
       live OS changes for free. Local time is only consulted when the OS
       reports no preference at all. */
    (function () {
      try {
        var d = document.documentElement,
            c = localStorage.getItem('theme-choice');
        if (c === 'light' || c === 'dark') { d.setAttribute('data-theme', c); return; }
        if (window.matchMedia('(prefers-color-scheme: no-preference)').matches) {
          var h = new Date().getHours();
          d.setAttribute('data-theme', (h < 7 || h >= 19) ? 'dark' : 'light');
        }
      } catch (e) {}
    })();
  </script>
